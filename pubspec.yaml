name: syncro
description: "Intelligent, rule-based calendar scheduling for Google Calendar and Apple Calendar with collision-free slot optimization."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Reactive Di
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Local Reactive Database
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # Calendar & Device Integration
  device_calendar: ^4.3.2
  timezone: ^0.9.4
  url_launcher: ^6.3.0

  # Utilities & Formatting
  uuid: ^4.5.1
  intl: ^0.20.3
  collection: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
